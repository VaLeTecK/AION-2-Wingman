# Quando pubblichi una release dal sito (Releases > Draft a new release, tag "vX.Y"):
# controlla che il tag sia uguale ad AppVersion nello script, crea lo zip da distribuire,
# lo allega alla release, scrive le note dalla sezione "## vX.Y" di CHANGELOG.md (se la
# descrizione è vuota) e, se c'è il secret VT_API_KEY, fa scansionare lo zip e lo script da
# VirusTotal aggiungendo i link dei risultati in fondo alle note della release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Tag e versione dello script devono coincidere
        run: |
          VER=$(grep -oP '^global AppVersion := "\K[^"]+' "AION 2 Wingman.ahk")
          echo "Tag: $TAG   AppVersion: $VER"
          if [ "${TAG#v}" != "$VER" ]; then
            echo "::error::Il tag $TAG non corrisponde ad AppVersion \"$VER\" nello script. Correggi AppVersion (o il tag) e ripubblica."
            exit 1
          fi

      - name: Crea il pacchetto zip
        run: |
          mkdir -p "dist/AION 2 Wingman"
          cp "AION 2 Wingman.ahk" "OCR.ahk" "Setup AION 2 Wingman.bat" "dist/AION 2 Wingman/"
          cp -r README INFOGRAPHICS BOSSES "dist/AION 2 Wingman/"
          cd dist && zip -qr ../AION-2-Wingman.zip "AION 2 Wingman"
          cd .. && cp "AION 2 Wingman.ahk" AION-2-Wingman.ahk

      - name: Note dal CHANGELOG (solo se la release non ha descrizione)
        # Note brevi: per ogni novità solo emoji + titolo, poi il link al CHANGELOG completo.
        # Le versioni fino alla 1.04 vanno in errore (PCRE -21) se le note sono troppo lunghe:
        # tenendole corte anche chi ha una versione vecchia riceve l'aggiornamento automatico.
        if: ${{ github.event.release.body == '' }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ["TAG"]; repo = os.environ["GITHUB_REPOSITORY"]
          link = f"📄 Full changelog / Changelog completo: https://github.com/{repo}/blob/{tag}/CHANGELOG.md"
          sec, on = [], False
          for line in open("CHANGELOG.md", encoding="utf-8").read().split("\n"):
              if line.strip() == "## v" + tag.lstrip("v"):
                  on = True; continue
              if on and line.startswith("## "):
                  break
              if on:
                  sec.append(line)
          def short(line, desc_len):
              # "- 🆕 **Titolo** – spiegazione" -> "- 🆕 **Titolo** – prima frase (accorciata)"
              if not line.startswith("- "):
                  return line
              parts = re.split(r"\s+[–-]\s+", line, maxsplit=1)
              title = parts[0]
              if desc_len <= 0 or len(parts) < 2:
                  return title
              d = re.split(r"(?<=[.;:!?])\s", parts[1].replace("**", ""), maxsplit=1)[0].rstrip(" .;:")
              if len(d) > desc_len:
                  d = d[:desc_len].rsplit(" ", 1)[0].rstrip(" ,;:") + "…"
              return f"{title} – {d}"
          # note brevi (le versioni fino alla 1.04 vanno in errore con note troppo lunghe):
          # titolo + piccola descrizione, accorciata finché tutto sta sotto il limite
          for n in (110, 90, 70, 55, 0):
              out = []
              for line in sec:
                  if line.strip() or (out and out[-1].strip()):
                      out.append(short(line, n))
              while out and not out[-1].strip():
                  out.pop()
              text = "\n".join(out + ["", link]).strip()
              if len(text) <= 1700:
                  break
          if len(text) > 1700:
              text = text[:1600].rsplit("\n", 1)[0] + "\n…\n\n" + link
          open("notes.md", "w", encoding="utf-8").write(text + "\n")
          PY
          if [ -s notes.md ]; then gh release edit "$TAG" --notes-file notes.md; fi

      - name: Allega lo zip alla release
        run: gh release upload "$TAG" AION-2-Wingman.zip --clobber

      - name: Scansione VirusTotal (link in fondo alle note)
        if: ${{ env.VT_API_KEY != '' }}
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ env.VT_API_KEY }}
          github_token: ${{ github.token }}
          update_release_body: true
          files: |
            AION-2-Wingman.zip
            AION-2-Wingman.ahk
